[project]
name = "mcp-internet"
version = "3.0.0"
description = "Web Search for LM Studio LLMS: a local MCP server for fresh web search, source reading, news, weather, and public data."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Sonesh", email = "sonesh@example.com" }
]
keywords = ["mcp", "mcp-server", "llm", "local-llm", "lm-studio", "ai", "internet", "web-search", "web-research", "citations", "youtube", "github", "reddit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx[http2]>=0.27.0",
    "httpcore>=1.0.5,<2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "ddgs>=9.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10.0"]
all = ["pdfplumber>=0.10.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[project.scripts]
mcp-internet = "mcp_internet.server:main"
mcp-internet-doctor = "mcp_internet.diagnostics:main"

[project.urls]
Homepage = "https://github.com/Sonesh-2202/mcp-internet"
Repository = "https://github.com/Sonesh-2202/mcp-internet"
Issues = "https://github.com/Sonesh-2202/mcp-internet/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_internet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
