name: Bug report
description: Report a reproducible problem with a tool or installation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private URLs, authorization headers, or fetched private page contents.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or Git commit.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the tool name and non-sensitive arguments.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
