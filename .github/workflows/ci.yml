name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --extra dev
      - run: uv run --extra dev pytest -q --junitxml=pytest-results.xml
      - name: Summarize test failures
        if: always()
        run: uv run python scripts/summarize_pytest.py pytest-results.xml
      - run: uv run --extra dev ruff check src tests scripts
      - run: uv build
      - run: uv run python -c "import glob, subprocess; subprocess.run(['uv', 'pip', 'install', '--target', 'dist/install', '--no-deps', glob.glob('dist/*.whl')[0]], check=True)"
      - run: uv run python -c "import sys; sys.path.insert(0, 'dist/install'); from mcp_internet import PRODUCT_NAME; from mcp_internet.server import mcp; assert PRODUCT_NAME == 'Web Search for LM Studio LLMS'; assert len(mcp._tool_manager.list_tools()) == 14"
